"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[prompts]
general = """
When work is associated with a Linear issue, preserve its identifier (for example, ANI-5) in the branch name and pull request. Never invent an issue identifier; derive it from the user request, Linear URL, branch, or attached task context.
"""
create_pr = """
When a pull request completes a linked Linear issue, include `Fixes <ISSUE-ID>` in the pull request description so Linear can apply the team's merge automation. For partial work that must not complete the issue, use `References <ISSUE-ID>` instead.
"""
rename_branch = """
When work is associated with a Linear issue, include the lowercased issue identifier in the branch name, for example `ani-5-short-description`.
"""
