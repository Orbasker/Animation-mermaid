version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
    # Let a freshly published version settle before we adopt it — this is the
    # cheapest defense against a compromised release, which is usually yanked
    # within days. Security advisories bypass the cooldown and open immediately.
    cooldown:
      default-days: 5
      semver-major-days: 7
    groups:
      # One PR per week for routine dev-tooling and minor/patch bumps keeps the
      # review load low; majors still arrive as individual PRs.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
