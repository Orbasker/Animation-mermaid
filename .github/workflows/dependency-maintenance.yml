name: Dependency maintenance

# Monthly supply-chain housekeeping: refresh the audit, license, and SBOM
# picture on a schedule (independent of what happens to land in PRs that month)
# and open a tracking issue so the review is deliberate rather than ad hoc.
# The runbook it links, docs/runbooks/dependency-security.md, is the source of
# truth for the steps.

on:
  schedule:
    # 09:00 UTC on the 1st of every month.
    - cron: "0 9 1 * *"
  workflow_dispatch:

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    name: Monthly dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Report every severity so the monthly review sees moderate/low advisories
      # the merge gate deliberately lets through. Never fails the job — the point
      # is to record the picture, not to block.
      - name: Audit production dependencies (report only)
        run: pnpm audit --prod --audit-level low | tee audit.txt || true

      - name: Check dependency licenses
        run: pnpm license:check | tee license.txt || true

      - name: Generate SBOM
        run: node tools/generate-sbom.mjs > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx-monthly
          path: sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Open monthly maintenance tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month="$(date -u +'%Y-%m')"
          title="Monthly dependency maintenance — ${month}"

          # Skip if this month's issue already exists (e.g. a manual re-run).
          if gh issue list --state open --search "${title} in:title" \
              --json title --jq '.[].title' | grep -qxF "${title}"; then
            echo "Issue \"${title}\" already open; skipping."
            exit 0
          fi

          {
            echo "Automated monthly supply-chain review. Follow"
            echo "[docs/runbooks/dependency-security.md](../blob/main/docs/runbooks/dependency-security.md)."
            echo
            echo "- [ ] Triage open Dependabot PRs and merge the safe grouped updates"
            echo "- [ ] Review the production audit output below and file/close exceptions"
            echo "- [ ] Confirm the SBOM artifact generated (\`sbom-cyclonedx-monthly\`)"
            echo "- [ ] Re-check whether any \`auditConfig.ignoreGhsas\` entry now has a fix"
            echo
            echo "<details><summary>pnpm audit --prod (all severities)</summary>"
            echo
            echo '```'
            cat audit.txt
            echo '```'
            echo
            echo "</details>"
          } > issue-body.md

          # Ensure the label exists, then create with it; fall back to no label
          # so a label hiccup can never swallow the tracking issue.
          gh label create dependencies --color 0366d6 \
            --description "Dependency and supply-chain maintenance" 2>/dev/null || true
          gh issue create --title "${title}" --body-file issue-body.md --label dependencies \
            || gh issue create --title "${title}" --body-file issue-body.md \
            || echo "::warning::Could not create tracking issue."
